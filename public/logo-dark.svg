<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 56" width="380" height="56" role="img" aria-label="EvictionNoticeGenerator — dark variant">
  <title>EvictionNoticeGenerator</title>

  <defs>
    <!-- On dark bg, shadow uses black for depth -->
    <filter id="shield-shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!--
    Dark variant: shield stays emerald (brand color holds on dark).
    Wordmark: "Eviction" white + "Notice" emerald / "GENERATOR" mid-gray tracked subtitle
  -->

  <!-- Shield — same geometry, same brand emerald, shadow tuned for dark bg -->
  <path
    d="M28 4 L50 12 L50 30 Q50 46 28 52 Q6 46 6 30 L6 12 Z"
    fill="#059669"
    stroke="#047857"
    stroke-width="1.5"
    filter="url(#shield-shadow-dark)"
  />

  <!-- White lines inside shield -->
  <line x1="15" y1="22" x2="41" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="15" y1="29" x2="41" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="15" y1="36" x2="33" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Checkmark -->
  <polyline
    points="21,42 26,47 35,38"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- "Eviction Notice" — white + emerald on dark -->
  <text
    x="64"
    y="27"
    font-family="'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-0.6"
    xml:space="preserve"
  ><tspan fill="#ffffff">Eviction </tspan><tspan fill="#059669">Notice</tspan></text>

  <!-- Separator rule — slightly brighter on dark -->
  <line x1="64" y1="33" x2="340" y2="33" stroke="#059669" stroke-width="0.75" opacity="0.5"/>

  <!-- "GENERATOR" subtitle — lighter gray that reads on dark -->
  <text
    x="65"
    y="48"
    font-family="'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-size="11.5"
    font-weight="400"
    letter-spacing="3.5"
    fill="#9CA3AF"
  >GENERATOR</text>

</svg>
