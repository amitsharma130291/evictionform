<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 56" width="380" height="56" role="img" aria-label="EvictionNoticeGenerator">
  <title>EvictionNoticeGenerator</title>

  <defs>
    <!-- Subtle emerald glow — gives icon dimension without being tacky -->
    <filter id="shield-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!--
    ICON: Filled emerald shield — 40px tall, centred in 56px canvas
    Shield path: classic tapered shield, pointed bottom
    White document lines inside + white checkmark at base
    Darker emerald border (#047857) for depth
  -->

  <!-- Shield — filled, with subtle drop shadow for premium dimension -->
  <path
    d="M28 4 L50 12 L50 30 Q50 46 28 52 Q6 46 6 30 L6 12 Z"
    fill="#059669"
    stroke="#047857"
    stroke-width="1.5"
    filter="url(#shield-shadow)"
  />

  <!-- White document lines inside shield — 3 lines representing legal text -->
  <line x1="15" y1="22" x2="41" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="15" y1="29" x2="41" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="15" y1="36" x2="33" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- White checkmark at shield point — signals "valid / done" -->
  <polyline
    points="21,42 26,47 35,38"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!--
    WORDMARK: Two-line stacked layout
    Line 1: "Eviction Notice" — Sora 800, 24px, charcoal — bold and confident
    Line 2: "Generator" — Sora 400, 12px, #6B7280, wide letter-spacing — subtitle register
    Left-aligned to icon, baseline anchored
  -->

  <!-- "Eviction Notice" — primary name, large and bold -->
  <text
    x="64"
    y="27"
    font-family="'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="-0.6"
    xml:space="preserve"
  ><tspan fill="#111827">Eviction </tspan><tspan fill="#059669">Notice</tspan></text>

  <!-- Thin emerald separator rule between the two lines -->
  <line x1="64" y1="33" x2="340" y2="33" stroke="#059669" stroke-width="0.75" opacity="0.4"/>

  <!-- "Generator" — subtitle, tracked out, lighter weight -->
  <text
    x="65"
    y="48"
    font-family="'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-size="11.5"
    font-weight="400"
    letter-spacing="3.5"
    fill="#6B7280"
  >GENERATOR</text>

</svg>
