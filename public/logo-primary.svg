<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 64" width="520" height="64" role="img" aria-label="EvictionNoticeGenerator.com logo">
  <title>EvictionNoticeGenerator.com</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- ═══════════════════════════════════════════
       ICON — document with emerald seal
       ViewBox slice: 0 0 56 64
  ════════════════════════════════════════════ -->

  <!-- Document body -->
  <rect x="2" y="2" width="40" height="52" rx="4" ry="4" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>

  <!-- Folded corner (top-right) -->
  <path d="M32 2 L42 12 L32 12 Z" fill="#F4F7FB" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 2 L42 12" fill="none" stroke="#111827" stroke-width="2"/>

  <!-- Document lines -->
  <line x1="9" y1="22" x2="35" y2="22" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="30" x2="35" y2="30" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="38" x2="28" y2="38" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>

  <!-- Emerald seal circle (bottom-right of document) -->
  <circle cx="38" cy="50" r="12" fill="#059669"/>

  <!-- Checkmark inside seal -->
  <polyline points="32,50 36,54 44,46" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════════════════════════════════
       WORDMARK — "EvictionNoticeGenerator" in Sora Bold
       Starts at x=68 (icon width 56 + 12 gap)
  ════════════════════════════════════════════ -->

  <!-- "Eviction" — primary dark -->
  <text
    x="68"
    y="42"
    font-family="'Sora', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
    fill="#111827"
  >Eviction</text>

  <!-- "Notice" — emerald accent -->
  <text
    x="221"
    y="42"
    font-family="'Sora', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
    fill="#059669"
  >Notice</text>

  <!-- "Generator" — primary dark -->
  <text
    x="330"
    y="42"
    font-family="'Sora', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
    fill="#111827"
  >Generator</text>

  <!-- Subtle ".com" suffix -->
  <text
    x="492"
    y="42"
    font-family="'Sora', 'Inter', system-ui, sans-serif"
    font-weight="400"
    font-size="14"
    fill="#6b7280"
  >.com</text>
</svg>
